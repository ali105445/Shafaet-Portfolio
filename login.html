<!DOCTYPE html>
<html>
<head>
    <title>PUC Student Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Inter&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

<div class="container">

<img src="https://puc.ac.bd/Content/new-template-assets/images/puc_logo.png" alt="">
<h1>Premier University</h1>

<div class="d-flex">
    <div class="login-box">
        <form class="p-4 rounded">
        <input class="form-control mb-3" type="number" placeholder="Enter your Id" required>
        <input class="form-control mb-3" type="password" placeholder="Password" required>
        <div class="checkbox mt-1 mb-3">
            <label for="Remember me">
                <input id="Remember me" type="checkbox" class="me-1">Remember me
            </label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log In</button>
        <br>
        <a href="">Forgot Passwords</a>
        </form>
    </div>
</div>
    
</div>
</body>
</html>
